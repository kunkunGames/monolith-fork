[/Script/MonolithCore.MonolithSettings]
; Append bounded/redacted editor action records to Logs/yyyyMMdd/action.jsonl.
bEnableDailyLog=True
; Default external image generation bridge. Monolith sends no provider credentials;
; the ima2/imag2-gen server owns OAuth/API-key authentication on the server host.
ImageGenBridgeServerUrl="http://192.168.1.147:3333"
ImageGenBridgeProvider=oauth
ImageGenBridgeDefaultModel="gpt-5.5"
ImageGenBridgeTimeoutSeconds=420.0
