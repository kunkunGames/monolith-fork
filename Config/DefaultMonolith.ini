[/Script/MonolithCore.MonolithSettings]
; Minimal MCP tool surface: advertise only monolith_find, monolith_discover,
; monolith_status, and the monolith_query dispatcher in tools/list; hide all other
; monolith actions (management/control-plane + guide/update/reindex). They stay callable
; by name / via monolith_query — only their tools/list advertisement is suppressed.
bExposeManagementTools=False
; Append bounded/redacted editor action records to Logs/yyyyMMdd/action.jsonl.
bEnableDailyLog=True
; Emit MCP structuredContent without duplicating successful JSON in text content.
bEnableStructuredToolResults=True
; Default external image generation bridge. Monolith sends no provider credentials;
; the ima2/imag2-gen server owns OAuth/API-key authentication on the server host.
ImageGenBridgeServerUrl="http://192.168.1.147:3333"
ImageGenBridgeProvider=oauth
ImageGenBridgeDefaultModel="gpt-5.5"
ImageGenBridgeTimeoutSeconds=420.0
