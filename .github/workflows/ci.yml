name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  hosted-static-ci:
    name: Hosted Static CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ vars.CI_PYTHON_VERSION || '3.11' }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Python syntax
        run: python -m compileall Scripts MCP Analyzer

      - name: Ruff critical lint
        run: ruff check Scripts/ MCP/ Analyzer/ --select E9,F63,F7,F82

      - name: Generate offline catalog snapshot
        run: >-
          python Tools/MonolithQuery/generate_monolith_catalog_snapshot.py
          --root .
          --out Tools/MonolithQuery/Generated/monolith_catalog_snapshot.json

      - name: Monolith static checker
        run: python Scripts/ci_static_checks.py --config .github/monolith-static-ci.json --github check

      - name: Bash syntax
        run: bash -n Scripts/monolith_proxy.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: ShellCheck
        run: shellcheck Scripts/monolith_proxy.sh

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $hasErrors = $false
          Get-ChildItem -Path Scripts -Filter "*.ps1" -Recurse | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $hasErrors = $true
              Write-Error "Syntax errors in $($_.Name):"
              $errors | Select-Object -First 20 | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($hasErrors) { exit 1 }

      - name: PSScriptAnalyzer advisory
        continue-on-error: true
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path Scripts -Recurse -Severity Error

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: actionlint
        run: |
          "$HOME/go/bin/actionlint" -config-file .github/actionlint.yaml -ignore 'SC2129'

      - name: Markdown lint advisory
        continue-on-error: true
        run: |
          npm install -g markdownlint-cli2
          markdownlint-cli2 > markdownlint.log 2>&1 || {
            sed -n '1,120p' markdownlint.log
            {
              echo "## Markdown lint advisory"
              grep '^Summary:' markdownlint.log || true
              echo
              echo "See the step log for the first 120 lines."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: TruffleHog verified secret scan
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/trufflesecurity/trufflehog:3.95.2 \
            filesystem /repo --results=verified --fail

      - name: Validate .uplugin and .uproject JSON
        run: |
          find . -maxdepth 2 \( -name "*.uplugin" -o -name "*.uproject" \) -print0 | while IFS= read -r -d "" f; do
            echo "Checking $f"
            python -m json.tool "$f" > /dev/null
          done
